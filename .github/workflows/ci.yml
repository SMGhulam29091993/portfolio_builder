# Continuous integration — the project's only independent control (ADR-0001: no review gates).
#
# One job proves `monorepo-foundation.AC1` on a clean clone and runs every check the Definition
# of Done names (`governance.md`): build, typecheck, lint (including the import-boundary rules),
# tests (including the architecture test and the service coverage floor), the OpenAPI drift
# check, and the end-to-end specs.
#
# Actions are pinned to full commit SHAs (tag in the trailing comment), so a moved tag cannot
# change what runs here; upgrading one is a deliberate edit, like the versions in ADR-0007.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Read-only token: CI checks code, it never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The web build bakes the `/api/v1` rewrite target in and fails fast without one
      # (`apps/web/src/lib/env.ts`). Nothing listens here during the build; E2E sets its own.
      API_INTERNAL_URL: http://127.0.0.1:4000
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version named by `packageManager` in the root package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The `engines` floor in the root package.json (ADR-0007 → Pinned versions).
          node-version: 24.12.0
          cache: pnpm

      # `--frozen-lockfile` fails if package.json and pnpm-lock.yaml disagree. The install also
      # downloads `mongod` for mongodb-memory-server (`allowBuilds` in pnpm-workspace.yaml).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, lint, test, drift
        run: pnpm turbo run build typecheck lint test drift

      # AC1: an immediate second run of the same command is served entirely from cache
      # (`monorepo-foundation.IT13`).
      - name: Second run is fully cached
        run: node scripts/check-turbo-cache.mjs build typecheck lint test drift

      # E2E01 uses Playwright's request fixture only, so no browser download is needed yet; add
      # `pnpm --filter @portfolio/web exec playwright install --with-deps chromium` with the first
      # browser-driven spec.
      - name: End-to-end tests
        run: pnpm test:e2e
