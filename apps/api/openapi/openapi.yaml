# API document for apps/api (int-standards.express.md → API documentation).
#
# Rules:
# - Every mounted route appears here, and nothing else does. `pnpm drift` (and CI) fails on
#   any difference, naming the method and path.
# - Paths are written in full, including the /api/v1 prefix.
# - Each operation carries its spec contract ID in `operationId` and `x-spec-id`.
# - info.version: bump the minor digit when a route is added or changed, the patch digit for
#   doc-only corrections (constitution.md → Versioning Rules).
openapi: 3.1.0
info:
  title: Portfolio Builder API
  version: 0.8.0
  description: >-
    CMS and published-site API for Portfolio Builder. Every response uses the standard envelope
    `{ success, message, data? }`; on failure `data.code` is a canonical error code.

tags:
  - name: health
    description: Ops and deploy readiness checks.
  - name: auth
    description: >-
      CMS sign-in, the single owner session and password reset by one-time code (owner-auth).
      Tokens travel only in the three HttpOnly session cookies, never in a body; a one-time code
      travels only by email. The login rate limit and the Origin allow-list (403
      ORIGIN_NOT_ALLOWED, 429 RATE_LIMITED) are added by owner-auth.T06, the password-reset
      routes and their send limit by owner-auth.T08. Registration, email verification and the
      one-time owner claim by account-registration.T03. Google sign-in (two browser redirects)
      by google-sign-in.T03.
  - name: portfolio
    description: >-
      The section engine (section-engine): the signed-in user's own portfolio, its sections, their order, visibility and the portfolio slug. Every route runs requireOwner then resolvePortfolio, which provisions the portfolio on first use; no route takes a portfolio id.
  - name: assets
    description: >-
      Files of the signed-in user's portfolio (media-assets): the résumé PDF and images, type detected from the bytes, size capped while streaming, deletion refused while referenced. Another user's asset id answers 404 everywhere.

paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: monorepo-foundation.API01
      x-spec-id: monorepo-foundation.API01
      summary: Liveness and database reachability
      description: >-
        Reports runtime facts only. MongoDB is probed with a `ping` that has its own short
        timeout, so the endpoint answers 503 instead of hanging when the database is down.
      security: []
      responses:
        '200':
          description: The API is up and MongoDB answered.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthReport'
              example:
                success: true
                message: ok
                data: { status: ok, db: up, version: 0.0.0, uptimeSec: 42 }
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: MongoDB did not answer the ping in time.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FailureEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [code, db]
                        properties:
                          code: { const: SERVICE_UNAVAILABLE }
                          db: { const: down }
              example:
                success: false
                message: Database unavailable
                data: { code: SERVICE_UNAVAILABLE, db: down }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: owner-auth.API01
      x-spec-id: owner-auth.API01
      summary: Sign in with email and password
      description: >-
        Starts the owner's one session, replacing any previous one (which ends it in every other
        browser), and sets the three session cookies. The email is compared case-insensitively.
        An unknown email and a wrong password get the same 401 body, and password verification
        runs in both cases. After 5 failed sign-ins (401) for one client IP and email within 15
        minutes, further attempts are refused with 429 until the window ends — even with the
        right password; successes and malformed bodies do not count. Requires the web app's
        Origin.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. The body carries the user only.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
              example:
                success: true
                message: Signed in
                data:
                  user: { id: 65f0c0ffee0000000000abcd, email: owner@example.com, displayName: Owner, role: owner }
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/LoginForbidden'
        '429':
          $ref: '#/components/responses/LoginRateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: owner-auth.API02
      x-spec-id: owner-auth.API02
      summary: Rotate the session tokens
      description: >-
        Reads all three cookies. The access token's signature is verified but its expiry is
        ignored; the token's jti, the jti cookie and the stored session's jti must match, and the
        refresh token's SHA-256 must equal the stored hash. On success the jti, access token and
        refresh token are all replaced in one atomic compare-and-set, and the session's 7-day
        lifetime restarts. Of two refreshes sent with the same cookies exactly one succeeds; the
        other receives SESSION_EXPIRED. Every 401 clears the three cookies. Requires the web
        app's Origin.
      security:
        - sessionCookies: []
      responses:
        '200':
          description: Rotated. New cookies are set; the body carries the user only.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
              example:
                success: true
                message: Session refreshed
                data:
                  user: { id: 65f0c0ffee0000000000abcd, email: owner@example.com, displayName: Owner }
        '401':
          description: >-
            UNAUTHENTICATED — the access cookie is absent or its signature invalid, no session
            exists, or the refresh token is absent or wrong with a matching jti (the session is
            then deleted). SESSION_EXPIRED — the three jti values differ (the session is kept).
            The cookies are cleared in every case.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookies'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FailureEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [code]
                        properties:
                          code: { enum: [UNAUTHENTICATED, SESSION_EXPIRED] }
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: owner-auth.API03
      x-spec-id: owner-auth.API03
      summary: Sign out
      description: >-
        If the access cookie's signature is valid (expiry ignored) and its jti still matches the
        stored session, deletes that session; a superseded browser cannot end the newer one.
        Always clears the three cookies. Idempotent — 200 with no or malformed cookies too.
        Requires the web app's Origin; a refused request changes nothing.
      security: []
      responses:
        '200':
          description: Signed out; the cookies are cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: Signed out
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: owner-auth.API04
      x-spec-id: owner-auth.API04
      summary: The signed-in owner
      description: Guarded by requireOwner, the same guard every /api/v1/cms route runs.
      security:
        - sessionCookies: []
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
              example:
                success: true
                message: Current user
                data:
                  user: { id: 65f0c0ffee0000000000abcd, email: owner@example.com, displayName: Owner }
        '401':
          $ref: '#/components/responses/GuardRejected'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: owner-auth.API05
      x-spec-id: owner-auth.API05
      summary: Request a password-reset code
      description: >-
        For the owner's address, issues a 6-digit code valid for 10 minutes (replacing any
        earlier one), stores it hashed and emails it; the response carries only a reference to
        send back with the code. For any other address, answers with the same status, message
        and shape — a decoy reference — and writes and sends nothing. Shares a send limit with
        API06 of 5 requests per hour per client IP; every request counts. Requires the web app's
        Origin.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: The reference and the code's lifetime. The same for every address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpIssuedEnvelope'
              example:
                success: true
                message: If the address is registered, a code has been sent
                data:
                  reference: $2b$10$abcdefghijklmnopqrstuuABCDEFGHIJKLMNOPQRSTUVWXYZ01234
                  expiresInSec: 600
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '429':
          $ref: '#/components/responses/CodeSendRateLimited'
        '502':
          $ref: '#/components/responses/MailUpstreamFailed'
        '503':
          $ref: '#/components/responses/PasswordResetUnavailable'

  /api/v1/auth/password/resend:
    post:
      tags: [auth]
      operationId: owner-auth.API06
      x-spec-id: owner-auth.API06
      summary: Resend a password-reset code
      description: >-
        Replaces the code the reference names with a new code, identifier and reference, resets
        the attempt count and emails the new code; the old reference and the old code stop
        working. Allowed once 60 seconds have passed since the last send — an expired code can
        still be resent while its reference lives (24 hours). Shares the API05 send limit.
        Requires the web app's Origin.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequest'
      responses:
        '200':
          description: The new reference and the new code's lifetime.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpIssuedEnvelope'
              example:
                success: true
                message: A new code has been sent
                data:
                  reference: $2b$10$zyxwvutsrqponmlkjihgfeZYXWVUTSRQPONMLKJIHGFEDCBA98765
                  expiresInSec: 600
        '400':
          $ref: '#/components/responses/OtpRejected'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '429':
          $ref: '#/components/responses/CodeSendRateLimited'
        '502':
          $ref: '#/components/responses/MailUpstreamFailed'
        '503':
          $ref: '#/components/responses/PasswordResetUnavailable'

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: owner-auth.API07
      x-spec-id: owner-auth.API07
      summary: Set a new password with a one-time code
      description: >-
        Checks the code against the reference: an unknown reference, a replaced code, five
        wrong codes already used or a wrong code all get one OTP_INVALID body; each wrong code
        uses one of five attempts. A code past its 10 minutes gets OTP_EXPIRED and is kept, so
        it can be resent. On success sets the new password, deletes the code and its reference,
        ends the owner's session in every browser and clears this browser's cookies. Requires
        the web app's Origin.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated; every session has ended.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearSessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: Password updated
        '400':
          $ref: '#/components/responses/OtpRejected'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/registration/options:
    get:
      tags: [auth]
      operationId: account-registration.API01
      x-spec-id: account-registration.API01
      summary: Whether the registration form should offer the owner key
      description: >-
        ownerClaimOpen is true while no owner account exists and an owner secret is configured.
      security: []
      responses:
        '200':
          description: The registration options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationOptionsEnvelope'
              example:
                success: true
                message: Registration options
                data: { ownerClaimOpen: false, googleSignIn: true }

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: account-registration.API02
      x-spec-id: account-registration.API02
      summary: Register an account and email a verification code
      description: >-
        Creates an unverified account (or refreshes the password and display name of an
        unverified one) and emails a 6-digit code; for an address that is already verified,
        answers identically with a decoy reference and writes and sends nothing. A non-empty
        ownerSecret claims the platform owner account while the claim is open and the value
        matches; otherwise it is refused with 403 OWNER_CLAIM_REFUSED and nothing is written.
        Spends the shared code-send limit. Requires the web app's Origin.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: The reference and the code's lifetime. The same for every address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpIssuedEnvelope'
              example:
                success: true
                message: Check your email for a verification code
                data:
                  reference: $2b$10$abcdefghijklmnopqrstuuABCDEFGHIJKLMNOPQRSTUVWXYZ01234
                  expiresInSec: 600
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/RegistrationForbidden'
        '409':
          $ref: '#/components/responses/OwnerExists'
        '429':
          $ref: '#/components/responses/CodeSendRateLimited'
        '502':
          $ref: '#/components/responses/MailUpstreamFailed'
        '503':
          $ref: '#/components/responses/PasswordResetUnavailable'

  /api/v1/auth/register/verify:
    post:
      tags: [auth]
      operationId: account-registration.API03
      x-spec-id: account-registration.API03
      summary: Verify the email with the code and sign in
      description: >-
        Checks the code (5 attempts, 10 minutes), marks the email verified and starts the
        user's session exactly as a sign-in does. Requires the web app's Origin.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Verified and signed in. The body carries the user only.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/OtpRejected'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/verification/request:
    post:
      tags: [auth]
      operationId: account-registration.API04
      x-spec-id: account-registration.API04
      summary: Request a new verification code by email
      description: >-
        For an unverified account, issues and emails a fresh code; for an unknown or verified
        address, answers identically with a decoy reference and writes and sends nothing. Spends
        the shared code-send limit. Requires the web app's Origin.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: The reference and the code's lifetime. The same for every address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpIssuedEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '429':
          $ref: '#/components/responses/CodeSendRateLimited'
        '502':
          $ref: '#/components/responses/MailUpstreamFailed'
        '503':
          $ref: '#/components/responses/PasswordResetUnavailable'

  /api/v1/auth/verification/resend:
    post:
      tags: [auth]
      operationId: account-registration.API05
      x-spec-id: account-registration.API05
      summary: Resend a verification code
      description: >-
        Replaces the verification code the reference names; the old reference and code stop
        working. Allowed once 60 seconds have passed since the last send. Spends the shared
        code-send limit. Requires the web app's Origin.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequest'
      responses:
        '200':
          description: A new reference and the code's lifetime.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpIssuedEnvelope'
        '400':
          $ref: '#/components/responses/OtpRejected'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '429':
          $ref: '#/components/responses/CodeSendRateLimited'
        '502':
          $ref: '#/components/responses/MailUpstreamFailed'
        '503':
          $ref: '#/components/responses/PasswordResetUnavailable'

  /api/v1/auth/google/start:
    get:
      tags: [auth]
      operationId: google-sign-in.API01
      x-spec-id: google-sign-in.API01
      summary: Start Google sign-in (browser navigation)
      description: >-
        Mints state, a PKCE verifier and a nonce, stores the verifier and nonce for 10 minutes,
        sets the google-state cookie and redirects to Google. When Google is not configured or
        cannot be reached, redirects to the CMS sign-in page with error=google_unavailable or
        error=google_failed. Shares a limit of 20 requests per 15 minutes per IP with API02.
      security: []
      responses:
        '302':
          description: To Google's authorization endpoint, or to /cms/login?error=<reason>.
          headers:
            Location: { schema: { type: string, format: uri } }
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/google/callback:
    get:
      tags: [auth]
      operationId: google-sign-in.API02
      x-spec-id: google-sign-in.API02
      summary: Complete Google sign-in (browser navigation)
      description: >-
        Checks the google-state cookie against the state query value, takes the stored verifier
        and nonce once, exchanges the code and verifies the ID token, resolves the user (linked
        subject, then a Google-verified email which links, then a new verified member) and sets
        the three session cookies. Never answers JSON on failure: redirects to /cms/login with
        error= one of google_unavailable, google_cancelled, google_state, google_failed,
        google_unverified, google_conflict.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: state, in: query, schema: { type: string, maxLength: 2048 } }
        - { name: error, in: query, schema: { type: string, maxLength: 2048 } }
      responses:
        '302':
          description: To /cms with the session cookies set, or to /cms/login?error=<reason>.
          headers:
            Location: { schema: { type: string, format: uri } }
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookies'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/cms/portfolio:
    get:
      tags: [portfolio]
      operationId: section-engine.API01
      x-spec-id: section-engine.API01
      summary: The signed-in user's portfolio draft
      description: >-
        Every registered section type in registration order, with its stored data, visibility
        and revision; a type with no stored document is returned with its defaults, visible
        false and revision 0. Provisions the portfolio from the template on the user's first CMS
        request.
      security:
        - sessionCookies: []
      responses:
        '200':
          description: The draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioDraftEnvelope'
        '401':
          $ref: '#/components/responses/GuardRejected'

  /api/v1/cms/portfolio/section-types:
    get:
      tags: [portfolio]
      operationId: section-engine.API02
      x-spec-id: section-engine.API02
      summary: The registered section types
      description: >-
        Type, label and flags of every registered section type.
      security:
        - sessionCookies: []
      responses:
        '200':
          description: The types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionTypesEnvelope'
        '401':
          $ref: '#/components/responses/GuardRejected'

  /api/v1/cms/portfolio/sections/{type}:
    put:
      tags: [portfolio]
      operationId: section-engine.API03
      x-spec-id: section-engine.API03
      summary: Save one section
      description: >-
        Validates data against the type's schema (free text cleaned; paths in errors are
        relative to data), assigns ids to list items without one, and stores it when
        expectedRevision matches. expectedRevision 0 creates a type that has no stored document
        yet. Requires the web app's Origin.
      security:
        - sessionCookies: []
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]*$', maxLength: 32 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSectionRequest'
      responses:
        '200':
          description: The saved section.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/GuardRejected'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'

  /api/v1/cms/portfolio/sections/{type}/visibility:
    patch:
      tags: [portfolio]
      operationId: section-engine.API04
      x-spec-id: section-engine.API04
      summary: Show or hide one section
      description: >-
        Sets visible when expectedRevision matches. hero cannot be hidden (409
        SECTION_NOT_HIDEABLE). Requires the web app's Origin.
      security:
        - sessionCookies: []
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9-]*$', maxLength: 32 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetVisibilityRequest'
      responses:
        '200':
          description: The section.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/GuardRejected'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SectionConflict'

  /api/v1/cms/portfolio/section-order:
    put:
      tags: [portfolio]
      operationId: section-engine.API05
      x-spec-id: section-engine.API05
      summary: Reorder the sections
      description: >-
        Replaces sectionOrder in one conditional write when order is an exact permutation of the
        orderable types (hero excluded) and expectedRevision matches the portfolio. Requires the
        web app's Origin.
      security:
        - sessionCookies: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderSectionsRequest'
      responses:
        '200':
          description: The portfolio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/GuardRejected'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '409':
          $ref: '#/components/responses/RevisionConflict'

  /api/v1/cms/portfolio/slug:
    put:
      tags: [portfolio]
      operationId: section-engine.API06
      x-spec-id: section-engine.API06
      summary: Change the portfolio address
      description: >-
        Replaces the slug (3 to 40 lower-case letters, digits and single inner hyphens) when it
        is neither reserved nor used by another portfolio and expectedRevision matches. Requires
        the web app's Origin.
      security:
        - sessionCookies: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeSlugRequest'
      responses:
        '200':
          description: The portfolio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/GuardRejected'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '409':
          $ref: '#/components/responses/SlugConflict'
  /api/v1/cms/assets:
    post:
      tags: [assets]
      operationId: media-assets.API01
      x-spec-id: media-assets.API01
      summary: Upload a file
      description: >-
        multipart/form-data with a kind field (resume or image) before one file part. The type
        is detected from the bytes (never the name or header); resume accepts PDF up to 5 MB,
        image PNG, JPEG or WebP up to 2 MB. An identical file already uploaded as the same kind
        answers 200 with that asset. Requires the web app's Origin.
      security:
        - sessionCookies: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { enum: [resume, image] }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/GuardRejected'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    get:
      tags: [assets]
      operationId: media-assets.API02
      x-spec-id: media-assets.API02
      summary: List files
      description: >-
        The portfolio's assets, newest first, optionally of one kind, each with inUse.
      security:
        - sessionCookies: []
      parameters:
        - { name: kind, in: query, schema: { enum: [resume, image] } }
      responses:
        '200':
          description: The assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/GuardRejected'

  /api/v1/cms/assets/{id}:
    delete:
      tags: [assets]
      operationId: media-assets.API03
      x-spec-id: media-assets.API03
      summary: Delete a file
      description: >-
        Removes the bytes, then the metadata, unless some module still references the asset (409
        ASSET_IN_USE with usedBy). Requires the web app's Origin.
      security:
        - sessionCookies: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedEnvelope'
        '401':
          $ref: '#/components/responses/GuardRejected'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AssetInUse'

  /api/v1/cms/assets/{id}/content:
    get:
      tags: [assets]
      operationId: media-assets.API04
      x-spec-id: media-assets.API04
      summary: Read a file
      description: >-
        The bytes with the stored Content-Type, X-Content-Type-Options nosniff,
        Content-Disposition inline and Cache-Control private, no-store. Only the asset's own
        user can read it.
      security:
        - sessionCookies: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: The file bytes.
        '401':
          $ref: '#/components/responses/GuardRejected'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookies:
      type: apiKey
      in: cookie
      name: access-token
      description: >-
        The session is three HttpOnly cookies set by sign-in and refresh: `access-token` (the
        15-minute HS256 JWT; Path=/api/v1), `jti` (the session id; Path=/api/v1) and
        `refresh-token` (opaque; Path=/api/v1/auth, so it never reaches /cms). All three last 7
        days; in production they are also Secure and SameSite=Strict, otherwise SameSite=Lax.
        The access token, the jti cookie and the stored session must carry the same jti.

  headers:
    SetSessionCookies:
      description: >-
        Three Set-Cookie lines: access-token, jti and refresh-token, each HttpOnly with
        Max-Age=604800 and the paths and flags of the sessionCookies scheme.
      schema: { type: string }
    ClearSessionCookies:
      description: >-
        Three Set-Cookie lines that expire access-token, jti and refresh-token on the paths they
        were set on.
      schema: { type: string }

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message]
      properties:
        success: { const: true }
        message: { type: string }
        data: {}
    FailureEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success: { const: false }
        message: { type: string }
        data:
          type: object
          required: [code]
          properties:
            code:
              type: string
              description: Canonical error code (int-standards.express.md → Error codes).
          additionalProperties: true
    AuthUser:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { enum: [owner, member] }
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 200 }
        displayName:
          type: string
          maxLength: 80
          description: Plain text; HTML tags and control characters are removed, then 1..80 characters.
        ownerSecret:
          type: string
          maxLength: 200
          description: The owner secret key. An empty string is treated as absent.
    VerifyEmailRequest:
      type: object
      required: [reference, otp]
      properties:
        reference: { type: string, minLength: 1, maxLength: 100 }
        otp: { type: string, pattern: '^[0-9]{6}$' }
    RegistrationOptionsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [ownerClaimOpen, googleSignIn]
              properties:
                ownerClaimOpen: { type: boolean }
                googleSignIn:
                  type: boolean
                  description: Whether Google sign-in is configured (google-sign-in.AC9).
    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [user]
              properties:
                user:
                  $ref: '#/components/schemas/AuthUser'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    ResendOtpRequest:
      type: object
      required: [reference]
      properties:
        reference: { type: string, minLength: 1, maxLength: 100 }
    ResetPasswordRequest:
      type: object
      required: [reference, otp, newPassword]
      properties:
        reference: { type: string, minLength: 1, maxLength: 100 }
        otp:
          type: string
          pattern: '^[0-9]{6}$'
          description: Exactly six digits; leading zeros count.
        newPassword: { type: string, minLength: 12, maxLength: 200 }
    OtpIssuedEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [reference, expiresInSec]
              properties:
                reference:
                  type: string
                  description: Opaque; sent back with the code. The code itself is only emailed.
                expiresInSec: { type: integer, const: 600 }
    HealthReport:
      type: object
      required: [status, db, version, uptimeSec]
      properties:
        status: { const: ok }
        db: { const: up }
        version: { type: string, minLength: 1 }
        uptimeSec: { type: integer, minimum: 0 }
    CmsPortfolio:
      type: object
      required: [id, slug, revision, sectionOrder]
      properties:
        id: { type: string }
        slug: { type: string }
        revision: { type: integer, minimum: 1 }
        sectionOrder: { type: array, items: { type: string } }
    CmsSection:
      type: object
      required: [type, visible, revision, data]
      properties:
        type: { type: string }
        visible: { type: boolean }
        revision: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
        data:
          description: The payload owned by that section type's spec.
    SectionTypeInfo:
      type: object
      required: [type, label, orderable, hideable, inNav]
      properties:
        type: { type: string }
        label: { type: string }
        orderable: { type: boolean }
        hideable: { type: boolean }
        inNav: { type: boolean }
    UpdateSectionRequest:
      type: object
      required: [expectedRevision, data]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        data: { description: The section type's payload. }
    SetVisibilityRequest:
      type: object
      required: [expectedRevision, visible]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        visible: { type: boolean }
    ReorderSectionsRequest:
      type: object
      required: [expectedRevision, order]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        order: { type: array, maxItems: 64, items: { type: string } }
    ChangeSlugRequest:
      type: object
      required: [expectedRevision, slug]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        slug: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])$' }
    PortfolioDraftEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [portfolio, sections]
              properties:
                portfolio: { : '#/components/schemas/CmsPortfolio' }
                sections: { type: array, items: { : '#/components/schemas/CmsSection' } }
    SectionTypesEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [types]
              properties:
                types: { type: array, items: { : '#/components/schemas/SectionTypeInfo' } }
    SectionEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [section]
              properties:
                section: { : '#/components/schemas/CmsSection' }
    PortfolioEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [portfolio]
              properties:
                portfolio: { : '#/components/schemas/CmsPortfolio' }
    AssetReference:
      type: object
      required: [id, kind, filename, mime, sizeBytes, sha256, createdAt, inUse]
      properties:
        id: { type: string }
        kind: { enum: [resume, image] }
        filename: { type: string, maxLength: 100 }
        mime: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string }
        createdAt: { type: string, format: date-time }
        inUse: { type: boolean }
    AssetEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [asset]
              properties:
                asset: { : '#/components/schemas/AssetReference' }
    AssetListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [assets]
              properties:
                assets: { type: array, items: { : '#/components/schemas/AssetReference' } }
    DeletedEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [deleted]
              properties:
                deleted: { const: true }
  responses:
    ValidationFailed:
      description: The request failed its schema.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, errors]
                    properties:
                      code: { const: VALIDATION_FAILED }
                      errors:
                        type: array
                        items:
                          type: object
                          required: [path, message]
                          properties:
                            path: { type: string }
                            message: { type: string }
    Unauthenticated:
      description: No valid credentials or session. One body for every cause.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: UNAUTHENTICATED }
          example:
            success: false
            message: Invalid email or password
            data: { code: UNAUTHENTICATED }
    GuardRejected:
      description: >-
        UNAUTHENTICATED — the access cookie is absent, malformed, expired (30 s leeway), tampered
        or signed with another secret, or no session exists for it; the cookies are kept so the
        client can refresh. SESSION_EXPIRED — a newer sign-in or refresh replaced this browser's
        session; the three cookies are cleared and the stored session is left alone.
      headers:
        Set-Cookie:
          description: On SESSION_EXPIRED only, as ClearSessionCookies.
          schema: { type: string }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [UNAUTHENTICATED, SESSION_EXPIRED] }
          example:
            success: false
            message: Your session has ended. Please sign in again
            data: { code: SESSION_EXPIRED }
    ServiceUnavailable:
      description: Redis (the session and one-time-code store) is unreachable. Nothing falls back to allowing the request.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: SERVICE_UNAVAILABLE }
          example:
            success: false
            message: Service unavailable
            data: { code: SERVICE_UNAVAILABLE }
    OriginNotAllowed:
      description: >-
        The request's Origin header is missing or is not the web app's origin (WEB_ORIGIN).
        Every non-GET request under /api/v1/auth and /api/v1/cms is checked before rate
        limiting, validation or authentication, so a refused request has no other effect.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: ORIGIN_NOT_ALLOWED }
          example:
            success: false
            message: Request origin is not allowed
            data: { code: ORIGIN_NOT_ALLOWED }
    LoginRateLimited:
      description: >-
        5 failed sign-ins for this client IP and email in the current 15-minute window. Sent
        whatever the password, until the window ends.
      headers:
        Retry-After:
          description: Seconds until the current window resets.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, retryAfterSec]
                    properties:
                      code: { const: RATE_LIMITED }
                      retryAfterSec: { type: integer, minimum: 1, maximum: 900 }
          example:
            success: false
            message: Too many requests
            data: { code: RATE_LIMITED, retryAfterSec: 840 }
    RateLimited:
      description: The client exceeded the rate limit for this route.
      headers:
        Retry-After:
          description: Seconds until the current window resets.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, retryAfterSec]
                    properties:
                      code: { const: RATE_LIMITED }
                      retryAfterSec: { type: integer, minimum: 1 }
          example:
            success: false
            message: Too many requests
            data: { code: RATE_LIMITED, retryAfterSec: 30 }
    CodeSendRateLimited:
      description: >-
        5 code requests (API05 and API06 together) from this client IP in the current hour, or —
        on API06 only — less than 60 seconds since the code was last sent.
      headers:
        Retry-After:
          description: Seconds until a send is allowed again.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, retryAfterSec]
                    properties:
                      code: { const: RATE_LIMITED }
                      retryAfterSec: { type: integer, minimum: 1, maximum: 3600 }
          example:
            success: false
            message: Too many requests
            data: { code: RATE_LIMITED, retryAfterSec: 45 }
    OtpRejected:
      description: >-
        VALIDATION_FAILED — the body failed its schema. OTP_INVALID — the reference resolves to
        nothing or to a replaced code, or (API07) the attempts are used up or the code is wrong;
        one body for all of them. OTP_EXPIRED (API07 only) — the code is past its 10 minutes.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [VALIDATION_FAILED, OTP_INVALID, OTP_EXPIRED] }
          example:
            success: false
            message: The code is invalid
            data: { code: OTP_INVALID }
    MailUpstreamFailed:
      description: The mail provider refused or could not be reached. Nothing about the cause is returned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, provider]
                    properties:
                      code: { const: UPSTREAM_FAILED }
                      provider: { const: mail }
          example:
            success: false
            message: Upstream provider failed
            data: { code: UPSTREAM_FAILED, provider: mail }
    LoginForbidden:
      description: >-
        ORIGIN_NOT_ALLOWED — the Origin is not the web app's. EMAIL_NOT_VERIFIED — the password was right but the email has not been verified yet; no session is created.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [ORIGIN_NOT_ALLOWED, EMAIL_NOT_VERIFIED] }
          example:
            success: false
            message: Verify your email address before signing in
            data: { code: EMAIL_NOT_VERIFIED }
    RegistrationForbidden:
      description: >-
        ORIGIN_NOT_ALLOWED — the Origin is not the web app's. OWNER_CLAIM_REFUSED — an owner secret was sent while the owner claim is closed, or it does not match; nothing is written or sent.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [ORIGIN_NOT_ALLOWED, OWNER_CLAIM_REFUSED] }
          example:
            success: false
            message: The owner key was not accepted
            data: { code: OWNER_CLAIM_REFUSED }
    OwnerExists:
      description: >-
        Another registration claimed the owner account first; nothing was written for this one.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: OWNER_EXISTS }
          example:
            success: false
            message: The platform owner has already been claimed
            data: { code: OWNER_EXISTS }
    PasswordResetUnavailable:
      description: >-
        No mail strategy is configured (outside production only; production refuses to start
        without one), or the code store (Redis) is unreachable.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: SERVICE_UNAVAILABLE }
          example:
            success: false
            message: Mail delivery is not configured
            data: { code: SERVICE_UNAVAILABLE }
    NotFound:
      description: >-
        The resource does not exist (for a section, the type is not registered).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: NOT_FOUND }
          example:
            success: false
            message: Resource not found
            data: { code: NOT_FOUND }
    RevisionConflict:
      description: >-
        expectedRevision is stale; data.currentRevision holds the stored revision. Nothing was written.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: REVISION_CONFLICT }
                      currentRevision: { type: integer, minimum: 0 }
          example:
            success: false
            message: This was changed elsewhere. Reload to see the latest version
            data: { code: REVISION_CONFLICT }
    SectionConflict:
      description: >-
        REVISION_CONFLICT (with currentRevision) or SECTION_NOT_HIDEABLE (hero). Nothing was written.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [REVISION_CONFLICT, SECTION_NOT_HIDEABLE] }
                      currentRevision: { type: integer, minimum: 0 }
          example:
            success: false
            message: This section cannot be hidden
            data: { code: SECTION_NOT_HIDEABLE }
    SlugConflict:
      description: >-
        SLUG_TAKEN (reserved, or used by another portfolio) or REVISION_CONFLICT (with currentRevision). Nothing was written.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [SLUG_TAKEN, REVISION_CONFLICT] }
                      currentRevision: { type: integer, minimum: 0 }
          example:
            success: false
            message: That address is already taken
            data: { code: SLUG_TAKEN }
    PayloadTooLarge:
      description: >-
        The file is over its kind's limit; data.maxBytes holds it. Nothing was stored.
      content:
        application/json:
          schema:
            allOf:
