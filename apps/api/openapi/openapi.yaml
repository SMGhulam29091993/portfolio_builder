  /api/v1/public/portfolios:
    get:
      tags: [public-site]
      operationId: public-site-rendering.API04
      x-spec-id: public-site-rendering.API04
      summary: Published portfolios
      description: >-
        Every portfolio with a live snapshot, by slug, for the sitemap.
      security: []
      responses:
        '200':
          description: The published portfolios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedPortfolioListEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/public/portfolios/{slug}:
    get:
      tags: [public-site]
      operationId: public-site-rendering.API01
      x-spec-id: public-site-rendering.API01
      summary: A portfolio's live snapshot
      description: >-
        The live snapshot's content with ETag equal to its content hash and Cache-Control
        public, max-age=0, must-revalidate. A matching If-None-Match is a bodiless 304. An
        unknown slug and an unpublished portfolio are the same 404.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])$' } }
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: The live snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPortfolioEnvelope'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/public/portfolios/{slug}/assets/{id}/{filename}:
    get:
      tags: [public-site]
      operationId: public-site-rendering.API02
      x-spec-id: public-site-rendering.API02
      summary: A published file
      description: >-
        The bytes of a file the live snapshot lists under exactly this name, with its stored
        type, ETag from its SHA-256, Cache-Control public, max-age=3600, X-Content-Type-Options
        nosniff and an inline Content-Disposition. Anything else is 404.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])$' } }
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - { name: filename, in: path, required: true, schema: { type: string, maxLength: 100 } }
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: The file bytes.
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    sessionCookies:
      type: apiKey
      in: cookie
      name: access-token
      description: >-
        The session is three HttpOnly cookies set by sign-in and refresh: `access-token` (the
        15-minute HS256 JWT; Path=/api/v1), `jti` (the session id; Path=/api/v1) and
        `refresh-token` (opaque; Path=/api/v1/auth, so it never reaches /cms). All three last 7
        days; in production they are also Secure and SameSite=Strict, otherwise SameSite=Lax.
        The access token, the jti cookie and the stored session must carry the same jti.

  headers:
    SetSessionCookies:
      description: >-
        Three Set-Cookie lines: access-token, jti and refresh-token, each HttpOnly with
        Max-Age=604800 and the paths and flags of the sessionCookies scheme.
      schema: { type: string }
    ClearSessionCookies:
      description: >-
        Three Set-Cookie lines that expire access-token, jti and refresh-token on the paths they
        were set on.
      schema: { type: string }

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message]
      properties:
        success: { const: true }
        message: { type: string }
        data: {}
    FailureEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success: { const: false }
        message: { type: string }
        data:
          type: object
          required: [code]
          properties:
            code:
              type: string
              description: Canonical error code (int-standards.express.md → Error codes).
          additionalProperties: true
    AuthUser:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { enum: [owner, member] }
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 200 }
        displayName:
          type: string
          maxLength: 80
          description: Plain text; HTML tags and control characters are removed, then 1..80 characters.
        ownerSecret:
          type: string
          maxLength: 200
          description: The owner secret key. An empty string is treated as absent.
    VerifyEmailRequest:
      type: object
      required: [reference, otp]
      properties:
        reference: { type: string, minLength: 1, maxLength: 100 }
        otp: { type: string, pattern: '^[0-9]{6}$' }
    RegistrationOptionsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [ownerClaimOpen, googleSignIn]
              properties:
                ownerClaimOpen: { type: boolean }
                googleSignIn:
                  type: boolean
                  description: Whether Google sign-in is configured (google-sign-in.AC9).
    UserEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [user]
              properties:
                user:
                  $ref: '#/components/schemas/AuthUser'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    ResendOtpRequest:
      type: object
      required: [reference]
      properties:
        reference: { type: string, minLength: 1, maxLength: 100 }
    ResetPasswordRequest:
      type: object
      required: [reference, otp, newPassword]
      properties:
        reference: { type: string, minLength: 1, maxLength: 100 }
        otp:
          type: string
          pattern: '^[0-9]{6}$'
          description: Exactly six digits; leading zeros count.
        newPassword: { type: string, minLength: 12, maxLength: 200 }
    OtpIssuedEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [reference, expiresInSec]
              properties:
                reference:
                  type: string
                  description: Opaque; sent back with the code. The code itself is only emailed.
                expiresInSec: { type: integer, const: 600 }
    HealthReport:
      type: object
      required: [status, db, version, uptimeSec]
      properties:
        status: { const: ok }
        db: { const: up }
        version: { type: string, minLength: 1 }
        uptimeSec: { type: integer, minimum: 0 }
    CmsPortfolio:
      type: object
      required: [id, slug, revision, sectionOrder]
      properties:
        id: { type: string }
        slug: { type: string }
        revision: { type: integer, minimum: 1 }
        sectionOrder: { type: array, items: { type: string } }
    CmsSection:
      type: object
      required: [type, visible, revision, data]
      properties:
        type: { type: string }
        visible: { type: boolean }
        revision: { type: integer, minimum: 0 }
        updatedAt: { type: string, format: date-time }
        data:
          description: The payload owned by that section type's spec.
    SectionTypeInfo:
      type: object
      required: [type, label, orderable, hideable, inNav]
      properties:
        type: { type: string }
        label: { type: string }
        orderable: { type: boolean }
        hideable: { type: boolean }
        inNav: { type: boolean }
    UpdateSectionRequest:
      type: object
      required: [expectedRevision, data]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        data: { description: The section type's payload. }
    SetVisibilityRequest:
      type: object
      required: [expectedRevision, visible]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        visible: { type: boolean }
    ReorderSectionsRequest:
      type: object
      required: [expectedRevision, order]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        order: { type: array, maxItems: 64, items: { type: string } }
    ChangeSlugRequest:
      type: object
      required: [expectedRevision, slug]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        slug: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])$' }
    PortfolioDraftEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [portfolio, sections]
              properties:
                portfolio: { : '#/components/schemas/CmsPortfolio' }
                sections: { type: array, items: { : '#/components/schemas/CmsSection' } }
    SectionTypesEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [types]
              properties:
                types: { type: array, items: { : '#/components/schemas/SectionTypeInfo' } }
    SectionEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [section]
              properties:
                section: { : '#/components/schemas/CmsSection' }
    PortfolioEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [portfolio]
              properties:
                portfolio: { : '#/components/schemas/CmsPortfolio' }
    AssetReference:
      type: object
      required: [id, kind, filename, mime, sizeBytes, sha256, createdAt, inUse]
      properties:
        id: { type: string }
        kind: { enum: [resume, image] }
        filename: { type: string, maxLength: 100 }
        mime: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string }
        createdAt: { type: string, format: date-time }
        inUse: { type: boolean }
    AssetEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [asset]
              properties:
                asset: { : '#/components/schemas/AssetReference' }
    AssetListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [assets]
              properties:
                assets: { type: array, items: { : '#/components/schemas/AssetReference' } }
    DeletedEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [deleted]
              properties:
                deleted: { const: true }
    Identity:
      type: object
      description: The identity shape owned by site-identity (API Contract); there is no phone field.
      required: [fullName, monogram, roleTitle, email, location, availability, socials, resume, footer, seo]
      properties:
        fullName: { type: string, maxLength: 80 }
        monogram: { type: string, pattern: '^[A-Z0-9]{1,3}$' }
        roleTitle: { type: string, maxLength: 80 }
        email: { type: string, format: email }
        location:
          type: object
          required: [label]
          properties:
            label: { type: string, maxLength: 60 }
            timezoneLabel: { type: string, maxLength: 24 }
        availability:
          type: object
          required: [enabled, label]
          properties:
            enabled: { type: boolean }
            label: { type: string, maxLength: 48 }
        socials:
          type: array
          maxItems: 6
          items:
            type: object
            required: [platform, url]
            properties:
              id: { type: string }
              platform: { enum: [github, linkedin, x, website] }
              url: { type: string, format: uri }
        resume:
          type: object
          required: [assetId, label]
          properties:
            assetId: { type: [string, 'null'] }
            label: { type: string, maxLength: 16 }
        footer:
          type: object
          required: [copyrightName, builtWith]
          properties:
            copyrightName: { type: string, maxLength: 80 }
            builtWith: { type: array, maxItems: 6, items: { type: string, maxLength: 24 } }
        seo:
          type: object
          required: [title, description, ogImageAssetId]
          properties:
            title: { type: string, maxLength: 70 }
            description: { type: string, maxLength: 160 }
            ogImageAssetId: { type: [string, 'null'] }
    UpdateIdentityRequest:
      type: object
      required: [expectedRevision, data]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        data: { $ref: '#/components/schemas/Identity' }
    IdentityEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [identity]
              properties:
                identity:
                  type: object
                  required: [revision, data]
                  properties:
                    revision: { type: integer, minimum: 0 }
                    updatedAt: { type: string, format: date-time }
                    data: { $ref: '#/components/schemas/Identity' }
    DesignSpec:
      type: object
      description: Owned by packages/design-tokens (design-theme → Design payload).
      required: [theme, layout]
      properties:
        theme:
          type: object
          required: [colors, fonts, radius, effects]
          properties:
            colors:
              type: object
              additionalProperties: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            fonts:
              type: object
              required: [sans, display, mono]
              properties:
                sans: { type: string }
                display: { type: string }
                mono: { type: string }
            radius: { enum: [none, sm, md, lg, xl] }
            effects:
              type: object
              required: [glow, dotGrid, motion]
              properties:
                glow: { type: boolean }
                dotGrid: { type: boolean }
                motion: { enum: [none, subtle, full] }
        layout:
          type: object
          additionalProperties: { type: string }
    UpdateDesignRequest:
      allOf:
        - $ref: '#/components/schemas/DesignSpec'
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision: { type: integer, minimum: 0 }
    ResetDesignRequest:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
    DesignEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [design]
              properties:
                design:
                  allOf:
                    - $ref: '#/components/schemas/DesignSpec'
                    - type: object
                      required: [revision]
                      properties:
                        revision: { type: integer, minimum: 0 }
                        updatedAt: { type: string, format: date-time }
                catalogue:
                  type: object
                  description: The variant catalogue and font allow-list (API01 only).
    CreateProposalRequest:
      type: object
      required: [prompt, scope]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 600, description: Plain text; tags are stripped. }
        scope: { enum: [theme, layout, both] }
        basedOnCurrent: { type: boolean, default: true }
        explore: { type: boolean, default: false, description: Ask for a new custom layout for every section in scope (design-library). }
    ApplyProposalRequest:
      type: object
      required: [expectedDesignRevision]
      properties:
        expectedDesignRevision: { type: integer, minimum: 0 }
    Proposal:
      type: object
      required: [id, status, prompt, scope, basedOnCurrent, explore, provider, model, design, rationale, failure, charge, durationMs, createdAt, completedAt]
      properties:
        id: { type: string }
        status: { enum: [pending, ready, failed, applied, discarded] }
        prompt: { type: string }
        scope: { enum: [theme, layout, both] }
        basedOnCurrent: { type: boolean }
        explore: { type: boolean }
        provider: { enum: [gemini, openrouter, ollama, stub] }
        model: { type: string }
        design:
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/DesignSpec'
                - type: object
                  properties:
                    customLayouts:
                      type: object
                      description: A CustomLayout per section the AI arranged (design-library); saved to the library on apply.
                      additionalProperties: { type: object }
            - type: 'null'
        rationale: { type: [string, 'null'], maxLength: 400 }
        failure:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code: { enum: [PROVIDER_TIMEOUT, PROVIDER_ERROR, INVALID_OUTPUT, CONTRAST_FAILED, INTERRUPTED] }
                message: { type: string }
            - type: 'null'
        charge:
          type: object
          required: [kind, credits, refunded]
          properties:
            kind: { enum: [none, free, credit] }
            credits: { type: integer, minimum: 0 }
            refunded: { type: boolean }
        durationMs: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    ProposalEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [proposal]
              properties:
                proposal: { $ref: '#/components/schemas/Proposal' }
    ProposalPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [proposals, nextCursor]
              properties:
                proposals:
                  type: array
                  items: { $ref: '#/components/schemas/Proposal' }
                nextCursor: { type: [string, 'null'] }
    AppliedProposalEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [design, proposal]
              properties:
                design:
                  allOf:
                    - $ref: '#/components/schemas/DesignSpec'
                    - type: object
                      required: [revision]
                      properties:
                        revision: { type: integer, minimum: 1 }
                        updatedAt: { type: string, format: date-time }
                proposal: { $ref: '#/components/schemas/Proposal' }
    AiProviderEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [provider, model, isStub, reachable, allowance]
              properties:
                provider: { enum: [gemini, openrouter, ollama, stub] }
                model: { type: string }
                isStub: { type: boolean }
                reachable: { type: boolean }
                allowance:
                  type: object
                  required: [unlimited, freeMonthly, freeUsed, creditCost, balance, resetsAt]
                  properties:
                    unlimited: { type: boolean }
                    freeMonthly: { type: integer, minimum: 0 }
                    freeUsed: { type: integer, minimum: 0 }
                    creditCost: { type: integer, minimum: 0 }
                    balance: { type: [integer, 'null'], minimum: 0 }
                    resetsAt: { type: string, format: date-time }
    LibraryLayout:
      type: object
      required: [id, section, name, layout, source, createdAt]
      properties:
        id: { type: string }
        section: { enum: [hero, about, work, experience, stack, contact] }
        name: { type: string, maxLength: 60 }
        layout: { type: object, description: A CustomLayout (packages/design-tokens; design-library spec). }
        source: { enum: [ai, preset] }
        createdAt: { type: string, format: date-time }
    LibraryLayoutsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [layouts]
              properties:
                layouts: { type: array, items: { $ref: '#/components/schemas/LibraryLayout' } }
    DesignPreset:
      type: object
      required: [id, name, design, createdAt]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 60 }
        design: { $ref: '#/components/schemas/DesignSpec' }
        createdAt: { type: string, format: date-time }
    DesignPresetsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [presets]
              properties:
                presets: { type: array, items: { $ref: '#/components/schemas/DesignPreset' } }
    DesignPresetEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [preset]
              properties:
                preset: { $ref: '#/components/schemas/DesignPreset' }
    SavePresetRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
    PublishIssue:
      type: object
      required: [rule, severity, path, message]
      properties:
        rule: { type: string, example: no-placeholder-text }
        severity: { type: string, enum: [error, warning] }
        path: { type: string, example: 'sections.work.projects[3].description' }
        message: { type: string }
    PublishRequest:
      type: object
      required: [expectedDraftHash]
      properties:
        expectedDraftHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        note: { type: string, maxLength: 200 }
    PublishingStatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [published, draft, hasUnpublishedChanges, revalidation]
              properties:
                published:
                  type: [object, 'null']
                  required: [version, publishedAt, contentHash]
                  properties:
                    version: { type: integer, minimum: 1 }
                    publishedAt: { type: string, format: date-time }
                    contentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
                draft:
                  type: object
                  required: [contentHash]
                  properties:
                    contentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
                hasUnpublishedChanges: { type: boolean }
                revalidation:
                  type: [object, 'null']
                  required: [status, at]
                  properties:
                    status: { type: string, enum: [ok, failed, pending] }
                    at: { type: string, format: date-time }
    ValidationReportEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [publishable, draftContentHash, issues]
              properties:
                publishable: { type: boolean }
                draftContentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
                issues:
                  type: array
                  items: { $ref: '#/components/schemas/PublishIssue' }
    PublishResultEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [snapshot, warnings, revalidation]
              properties:
                snapshot:
                  type: object
                  required: [version, publishedAt, contentHash]
                  properties:
                    version: { type: integer, minimum: 1 }
                    publishedAt: { type: string, format: date-time }
                    contentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
                warnings:
                  type: array
                  items: { $ref: '#/components/schemas/PublishIssue' }
                revalidation: { type: string, enum: [ok, failed] }
    SnapshotPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [snapshots, nextCursor]
              properties:
                snapshots:
                  type: array
                  items:
                    type: object
                    required: [version, publishedAt, note, contentHash, isCurrent, revalidation]
                    properties:
                      version: { type: integer, minimum: 1 }
                      publishedAt: { type: string, format: date-time }
                      note: { type: [string, 'null'] }
                      contentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
                      isCurrent: { type: boolean }
                      revalidation: { type: string, enum: [ok, failed, pending] }
                nextCursor: { type: [string, 'null'] }
    ActivationEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [snapshot, revalidation]
              properties:
                snapshot:
                  type: object
                  required: [version, contentHash]
                  properties:
                    version: { type: integer, minimum: 1 }
                    contentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
                revalidation: { type: string, enum: [ok, failed] }
    RevalidationEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [revalidation]
              properties:
                revalidation: { type: string, enum: [ok, failed] }
    PublicPortfolioEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [slug, version, publishedAt, content]
              properties:
                slug: { type: string }
                version: { type: integer, minimum: 1 }
                publishedAt: { type: string, format: date-time }
                content:
                  type: object
                  description: PublishedContent (publish-pipeline → Published content).
                  required: [schemaVersion, identity, sections, design, assets]
                  properties:
                    schemaVersion: { type: integer, minimum: 1 }
                    identity: { $ref: '#/components/schemas/Identity' }
                    sections:
                      type: array
                      items:
                        type: object
                        required: [type, data]
                        properties:
                          type: { type: string }
                          data: { type: object }
                    design: { type: object }
                    assets: { type: array, items: { type: object } }
    PublishedPortfolioListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [portfolios]
              properties:
                portfolios:
                  type: array
                  items:
                    type: object
                    required: [slug, publishedAt]
                    properties:
                      slug: { type: string }
                      publishedAt: { type: string, format: date-time }
  responses:
    ValidationFailed:
      description: The request failed its schema.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, errors]
                    properties:
                      code: { const: VALIDATION_FAILED }
                      errors:
                        type: array
                        items:
                          type: object
                          required: [path, message]
                          properties:
                            path: { type: string }
                            message: { type: string }
    Unauthenticated:
      description: No valid credentials or session. One body for every cause.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: UNAUTHENTICATED }
          example:
            success: false
            message: Invalid email or password
            data: { code: UNAUTHENTICATED }
    GuardRejected:
      description: >-
        UNAUTHENTICATED — the access cookie is absent, malformed, expired (30 s leeway), tampered
        or signed with another secret, or no session exists for it; the cookies are kept so the
        client can refresh. SESSION_EXPIRED — a newer sign-in or refresh replaced this browser's
        session; the three cookies are cleared and the stored session is left alone.
      headers:
        Set-Cookie:
          description: On SESSION_EXPIRED only, as ClearSessionCookies.
          schema: { type: string }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [UNAUTHENTICATED, SESSION_EXPIRED] }
          example:
            success: false
            message: Your session has ended. Please sign in again
            data: { code: SESSION_EXPIRED }
    ServiceUnavailable:
      description: Redis (the session and one-time-code store) is unreachable. Nothing falls back to allowing the request.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: SERVICE_UNAVAILABLE }
          example:
            success: false
            message: Service unavailable
            data: { code: SERVICE_UNAVAILABLE }
    OriginNotAllowed:
      description: >-
        The request's Origin header is missing or is not the web app's origin (WEB_ORIGIN).
        Every non-GET request under /api/v1/auth and /api/v1/cms is checked before rate
        limiting, validation or authentication, so a refused request has no other effect.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: ORIGIN_NOT_ALLOWED }
          example:
            success: false
            message: Request origin is not allowed
            data: { code: ORIGIN_NOT_ALLOWED }
    LoginRateLimited:
      description: >-
        5 failed sign-ins for this client IP and email in the current 15-minute window. Sent
        whatever the password, until the window ends.
      headers:
        Retry-After:
          description: Seconds until the current window resets.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, retryAfterSec]
                    properties:
                      code: { const: RATE_LIMITED }
                      retryAfterSec: { type: integer, minimum: 1, maximum: 900 }
          example:
            success: false
            message: Too many requests
            data: { code: RATE_LIMITED, retryAfterSec: 840 }
    RateLimited:
      description: The client exceeded the rate limit for this route.
      headers:
        Retry-After:
          description: Seconds until the current window resets.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, retryAfterSec]
                    properties:
                      code: { const: RATE_LIMITED }
                      retryAfterSec: { type: integer, minimum: 1 }
          example:
            success: false
            message: Too many requests
            data: { code: RATE_LIMITED, retryAfterSec: 30 }
    CodeSendRateLimited:
      description: >-
        5 code requests (API05 and API06 together) from this client IP in the current hour, or —
        on API06 only — less than 60 seconds since the code was last sent.
      headers:
        Retry-After:
          description: Seconds until a send is allowed again.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, retryAfterSec]
                    properties:
                      code: { const: RATE_LIMITED }
                      retryAfterSec: { type: integer, minimum: 1, maximum: 3600 }
          example:
            success: false
            message: Too many requests
            data: { code: RATE_LIMITED, retryAfterSec: 45 }
    OtpRejected:
      description: >-
        VALIDATION_FAILED — the body failed its schema. OTP_INVALID — the reference resolves to
        nothing or to a replaced code, or (API07) the attempts are used up or the code is wrong;
        one body for all of them. OTP_EXPIRED (API07 only) — the code is past its 10 minutes.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [VALIDATION_FAILED, OTP_INVALID, OTP_EXPIRED] }
          example:
            success: false
            message: The code is invalid
            data: { code: OTP_INVALID }
    MailUpstreamFailed:
      description: The mail provider refused or could not be reached. Nothing about the cause is returned.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, provider]
                    properties:
                      code: { const: UPSTREAM_FAILED }
                      provider: { const: mail }
          example:
            success: false
            message: Upstream provider failed
            data: { code: UPSTREAM_FAILED, provider: mail }
    LoginForbidden:
      description: >-
        ORIGIN_NOT_ALLOWED — the Origin is not the web app's. EMAIL_NOT_VERIFIED — the password was right but the email has not been verified yet; no session is created.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [ORIGIN_NOT_ALLOWED, EMAIL_NOT_VERIFIED] }
          example:
            success: false
            message: Verify your email address before signing in
            data: { code: EMAIL_NOT_VERIFIED }
    RegistrationForbidden:
      description: >-
        ORIGIN_NOT_ALLOWED — the Origin is not the web app's. OWNER_CLAIM_REFUSED — an owner secret was sent while the owner claim is closed, or it does not match; nothing is written or sent.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [ORIGIN_NOT_ALLOWED, OWNER_CLAIM_REFUSED] }
          example:
            success: false
            message: The owner key was not accepted
            data: { code: OWNER_CLAIM_REFUSED }
    OwnerExists:
      description: >-
        Another registration claimed the owner account first; nothing was written for this one.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: OWNER_EXISTS }
          example:
            success: false
            message: The platform owner has already been claimed
            data: { code: OWNER_EXISTS }
    PasswordResetUnavailable:
      description: >-
        No mail strategy is configured (outside production only; production refuses to start
        without one), or the code store (Redis) is unreachable.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: SERVICE_UNAVAILABLE }
          example:
            success: false
            message: Mail delivery is not configured
            data: { code: SERVICE_UNAVAILABLE }
    NotFound:
      description: >-
        The resource does not exist (for a section, the type is not registered).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: NOT_FOUND }
          example:
            success: false
            message: Resource not found
            data: { code: NOT_FOUND }
    RevisionConflict:
      description: >-
        expectedRevision is stale; data.currentRevision holds the stored revision. Nothing was written.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: REVISION_CONFLICT }
                      currentRevision: { type: integer, minimum: 0 }
          example:
            success: false
            message: This was changed elsewhere. Reload to see the latest version
            data: { code: REVISION_CONFLICT }
    SectionConflict:
      description: >-
        REVISION_CONFLICT (with currentRevision) or SECTION_NOT_HIDEABLE (hero). Nothing was written.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [REVISION_CONFLICT, SECTION_NOT_HIDEABLE] }
                      currentRevision: { type: integer, minimum: 0 }
          example:
            success: false
            message: This section cannot be hidden
            data: { code: SECTION_NOT_HIDEABLE }
    SlugConflict:
      description: >-
        SLUG_TAKEN (reserved, or used by another portfolio) or REVISION_CONFLICT (with currentRevision). Nothing was written.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [SLUG_TAKEN, REVISION_CONFLICT] }
                      currentRevision: { type: integer, minimum: 0 }
          example:
            success: false
            message: That address is already taken
            data: { code: SLUG_TAKEN }
    PayloadTooLarge:
      description: >-
        The file is over its kind's limit; data.maxBytes holds it. Nothing was stored.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: PAYLOAD_TOO_LARGE }
                      maxBytes: { type: integer }
          example:
            success: false
            message: Request body is too large
            data: { code: PAYLOAD_TOO_LARGE }
    UnsupportedMediaType:
      description: >-
        The detected type is not accepted for the kind; data.allowed lists what is. Nothing was stored.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: UNSUPPORTED_MEDIA_TYPE }
                      allowed: { type: array, items: { type: string } }
          example:
            success: false
            message: Unsupported media type
            data: { code: UNSUPPORTED_MEDIA_TYPE }
    AssetInUse:
      description: >-
        The asset is referenced; data.usedBy names where. Nothing was deleted.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: ASSET_IN_USE }
                      usedBy: { type: array, items: { type: string } }
          example:
            success: false
            message: This file is in use and cannot be deleted
            data: { code: ASSET_IN_USE }
    PublishConflict:
      description: >-
        The draft changed since it was checked (with draftContentHash), it is already live, or another publish switched the live version first.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [DRAFT_CHANGED, NOTHING_TO_PUBLISH, PUBLISH_CONFLICT] }
                      draftContentHash: { type: string, pattern: '^[0-9a-f]{64}$' }
          example:
            success: false
            message: The draft changed since it was checked
            data: { code: DRAFT_CHANGED }
    PublishBlocked:
      description: >-
        At least one publish rule reported an error; every issue is listed.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: PUBLISH_BLOCKED }
                      issues:
                        type: array
                        items: { $ref: '#/components/schemas/PublishIssue' }
          example:
            success: false
            message: Fix the listed problems before publishing
            data: { code: PUBLISH_BLOCKED }
    ActivationConflict:
      description: >-
        That version is already live, or another publish switched the live version first.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [ALREADY_CURRENT, PUBLISH_CONFLICT] }
          example:
            success: false
            message: That version is already live
            data: { code: ALREADY_CURRENT }
    NothingPublished:
      description: >-
        Nothing has been published yet.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: NOTHING_PUBLISHED }
          example:
            success: false
            message: Nothing is published yet
            data: { code: NOTHING_PUBLISHED }
    CreditsRequired:
      description: >-
        The free monthly generations are used up and the credits do not cover one more. Nothing
        was stored.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, creditsRequired, balance]
                    properties:
                      code: { const: CREDITS_REQUIRED }
                      creditsRequired: { type: integer, minimum: 0 }
                      balance: { type: integer, minimum: 0 }
          example:
            success: false
            message: Not enough credits
            data: { code: CREDITS_REQUIRED, creditsRequired: 1, balance: 0 }
    GenerationInProgress:
      description: >-
        A proposal for this portfolio is already pending; data.proposalId names it.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { const: GENERATION_IN_PROGRESS }
                      proposalId: { type: [string, 'null'] }
          example:
            success: false
            message: A design proposal is already being generated
            data: { code: GENERATION_IN_PROGRESS }
    ProposalNotReady:
      description: >-
        The proposal is not in a state that allows this; data.status holds its status.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, status]
                    properties:
                      code: { const: PROPOSAL_NOT_READY }
                      status: { enum: [pending, ready, failed, applied, discarded] }
          example:
            success: false
            message: The design proposal is not ready
            data: { code: PROPOSAL_NOT_READY, status: pending }
    ProposalApplyConflict:
      description: >-
        PROPOSAL_NOT_READY (with status) or REVISION_CONFLICT (with currentRevision). The design
        is unchanged.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { enum: [PROPOSAL_NOT_READY, REVISION_CONFLICT] }
                      status: { enum: [pending, ready, failed, applied, discarded] }
                      currentRevision: { type: integer, minimum: 0 }
          example:
            success: false
            message: The design proposal is not ready
            data: { code: PROPOSAL_NOT_READY, status: failed }
    LayoutInUse:
      description: The draft design or a preset names this layout; data.usedBy says which. Nothing was deleted.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, usedBy]
                    properties:
                      code: { const: LAYOUT_IN_USE }
                      usedBy: { type: array, items: { enum: [draft, preset] } }
    LibraryFull:
      description: The library already holds its maximum (data.max). Nothing was saved.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/FailureEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code, max]
                    properties:
                      code: { const: LIBRARY_FULL }
                      max: { type: integer, minimum: 1 }
    NotModified:
      description: The client's copy is current (If-None-Match matched); no body.
