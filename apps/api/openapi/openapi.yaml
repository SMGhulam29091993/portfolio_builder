                $ref: '#/components/schemas/AppliedProposalEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/GuardRejected'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProposalApplyConflict'
  /api/v1/cms/ai/design-proposals/{id}/preset:
    post:
      tags: [ai-design]
      operationId: ai-design-studio.API07
      x-spec-id: ai-design-studio.API07
      summary: Save a proposal as a design preset
      description: >-
        Saves a ready or applied proposal as a named preset (design-library); its custom layouts
        are saved to the library first. Requires the web app Origin.
