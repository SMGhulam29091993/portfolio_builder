            schema:
              $ref: '#/components/schemas/SavePresetRequest'
      responses:
        '201':
          description: The preset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignPresetEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/GuardRejected'
        '403':
          $ref: '#/components/responses/OriginNotAllowed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProposalNotReady'
  /api/v1/cms/ai/provider:
    get:
      tags: [ai-design]
      operationId: ai-design-studio.API06
      x-spec-id: ai-design-studio.API06
      summary: The design provider and the allowance
      description: >-
        The configured provider and model (or the development stub), whether it answers, and the
        user's free generations this month, the credit cost and the balance (null for the owner).
      security:
        - sessionCookies: []
      responses:
        '200':
          description: Provider and allowance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderEnvelope'
        '401':
